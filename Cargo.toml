[workspace]
members = ["crates/greenlens-core", "crates/greenlens-radiance", "crates/greenlens-runner", "crates/greenlens-cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AdrianIp0204/GreenLens"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
