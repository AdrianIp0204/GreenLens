[package]
name = "greenlens-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "greenlens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
greenlens-core = { path = "../../../crates/greenlens-core" }
greenlens-runner = { path = "../../../crates/greenlens-runner" }
greenlens-radiance = { path = "../../../crates/greenlens-radiance" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
