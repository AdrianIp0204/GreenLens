[package]
name = "greenlens-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "greenlens"
path = "src/main.rs"

[dependencies]
greenlens-core = { path = "../greenlens-core" }
greenlens-radiance = { path = "../greenlens-radiance" }
greenlens-runner = { path = "../greenlens-runner" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
