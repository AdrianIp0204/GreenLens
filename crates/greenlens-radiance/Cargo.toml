[package]
name = "greenlens-radiance"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
greenlens-core = { path = "../greenlens-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security"] }

[[bin]]
name = "greenlens-science"
path = "src/bin/science.rs"
